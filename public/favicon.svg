<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <!-- Vibrant Emerald Gradient -->
    <linearGradient id="fav-emerald" x1="6" y1="36" x2="34" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Vibrant Saffron/Gold Gradient -->
    <linearGradient id="fav-saffron" x1="20" y1="26" x2="38" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Golden Star -->
    <linearGradient id="fav-star" x1="18" y1="6" x2="26" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Udyam: Ascending Enterprise Arc -->
  <path d="M8 14C8 24.5 14 34 23.5 34C28.5 34 32.8 31.2 35.5 27.2L30.5 23.8C28.8 26.5 26.2 28.2 23.5 28.2C17.5 28.2 13.8 21.8 13.8 14H8Z" fill="url(#fav-emerald)"/>

  <!-- Growth Momentum: 45° Forward Arrow -->
  <path d="M23 20L38 8L32 23L28.8 18.2L20.2 24.5L17.5 20.8L26.2 14.5L23 20Z" fill="url(#fav-saffron)"/>

  <!-- Saathi: Guiding Pole Star (Dhruva Tara) -->
  <path d="M22 6L23.8 12.2L30 14L23.8 15.8L22 22L20.2 15.8L14 14L20.2 12.2L22 6Z" fill="url(#fav-star)"/>
  <circle cx="22" cy="14" r="1.8" fill="#FFFFFF"/>
</svg>